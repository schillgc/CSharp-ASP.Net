name: Treehouse Defense CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "archive/console/treehouse-defense/**"
      - ".github/workflows/treehouse-defense.yml"
  pull_request:
    branches: [master]
    paths:
      - "archive/console/treehouse-defense/**"
      - ".github/workflows/treehouse-defense.yml"

permissions:
  contents: read

concurrency:
  group: treehouse-defense-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build application
        run: dotnet build archive/console/treehouse-defense/TreehouseDefense.csproj --configuration Release
      - name: Run contract tests
        run: dotnet run --project archive/console/treehouse-defense/tests/TreehouseDefense.ContractTests/TreehouseDefense.ContractTests.csproj --configuration Release
      - name: Smoke-test the seeded game
        run: dotnet run --project archive/console/treehouse-defense/TreehouseDefense.csproj --configuration Release -- --seed 42
