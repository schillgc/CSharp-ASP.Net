name: Fitness Frog CI

on:
  push:
    branches: [master]
    paths:
      - "archive/console/fitness-frog/**"
      - ".github/workflows/fitness-frog.yml"
  pull_request:
    branches: [master]
    paths:
      - "archive/console/fitness-frog/**"
      - ".github/workflows/fitness-frog.yml"

permissions:
  contents: read

concurrency:
  group: fitness-frog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build application
        run: dotnet build archive/console/fitness-frog/FitnessFrog.csproj --configuration Release
      - name: Run contract tests
        run: dotnet run --project archive/console/fitness-frog/tests/FitnessFrog.ContractTests/FitnessFrog.ContractTests.csproj --configuration Release
      - name: Smoke-test console session
        run: printf '12.5\nquit\n' | dotnet run --project archive/console/fitness-frog/FitnessFrog.csproj --configuration Release
