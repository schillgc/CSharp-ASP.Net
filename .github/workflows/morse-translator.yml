name: Morse Translator CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "archive/console/morse-translator/**"
      - ".github/workflows/morse-translator.yml"
  pull_request:
    branches: [master]
    paths:
      - "archive/console/morse-translator/**"
      - ".github/workflows/morse-translator.yml"

permissions:
  contents: read

jobs:
  build-and-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build application
        run: dotnet build archive/console/morse-translator/MorseTranslator.csproj --configuration Release
      - name: Run contract tests
        run: dotnet run --project archive/console/morse-translator/tests/MorseTranslator.ContractTests/MorseTranslator.ContractTests.csproj --configuration Release
